name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archive the exact commit being checked
        shell: bash
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/copilot-byok-manager-source.tar"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/copilot-byok-manager-source.tar
          retention-days: 7
          if-no-files-found: error

  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate release versions and failure gates
        run: |
          npm run check:version
          npm run test:release
          npm run check:docs
      - name: Check browser application
        run: npm run check:web
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        env:
          COPILOT_BYOK_MANAGER_TEST_REQUIRE_LINKS: "1"
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native Tauri application
        if: runner.os == 'Windows'
        run: npm run build -- --no-bundle -- --locked
      - name: Check patch whitespace
        shell: bash
        run: git show --format= --check HEAD
