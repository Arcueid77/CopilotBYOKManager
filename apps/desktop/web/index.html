<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CopilotBYOKManager</title>
    <link rel="icon" type="image/png" href="assets/app-icon.png" />
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="installer.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="setup-usage.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="assets/app-icon.png" width="34" height="34" alt="" aria-hidden="true" />
          <div>
            <strong>CopilotBYOKManager</strong>
            <small data-i18n="本地 Copilot 配置管理">本地 Copilot 配置管理</small>
          </div>
        </div>

        <nav id="primary-nav" aria-label="主导航" data-i18n-aria-label="主导航">
          <button class="nav-item active" data-route="overview" aria-current="page">
            <span data-i18n="总览">总览</span>
          </button>
          <button class="nav-item" data-route="connections">
            <span data-i18n="供应商">供应商</span>
          </button>
          <button class="nav-item" data-route="clients"><span data-i18n="应用">应用</span></button>
          <button class="nav-item" data-route="about"><span data-i18n="关于">关于</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="runtime-dot"></div>
          <div>
            <strong id="runtime-label" data-i18n="读取状态中">读取状态中</strong>
            <small id="runtime-detail" data-i18n="检查本地后端">检查本地后端</small>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">CopilotBYOKManager</p>
            <h1 id="page-title" data-i18n="总览">总览</h1>
            <p id="page-subtitle" data-i18n="管理连接，预览后发布。">管理连接，预览后发布。</p>
          </div>
          <div class="topbar-actions">
            <label class="appearance-picker"><span data-i18n="外观">外观</span><select id="interface-theme" data-appearance-select aria-label="外观" data-i18n-aria-label="外观"><option value="system" data-i18n="跟随系统">跟随系统</option><option value="light" data-i18n="浅色">浅色</option><option value="dark" data-i18n="深色">深色</option></select></label>
            <label class="language-picker"><span data-i18n="界面语言">界面语言</span><select id="interface-language" aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="en" lang="en">English</option><option value="zh-CN" lang="zh-CN">简体中文</option></select></label>
            <button id="refresh-button" class="button ghost" data-i18n="刷新">刷新</button>
            <button id="add-connection-button" class="button primary" data-i18n="添加连接">添加连接</button>
          </div>
        </header>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="assertive"></div>
    <script src="i18n-messages.js"></script>
    <script src="i18n.js"></script>
    <script src="ui-lifecycle.js"></script>
    <script src="deployment-review.js"></script>
    <script src="installer-ui.js"></script>
    <script src="account-ui.js"></script>
    <script src="setup-ui.js"></script>
    <script src="jetbrains-ui.js"></script>
    <script src="plan-session.js"></script>
    <script src="core-ui.js"></script>
    <script src="model-discovery.js"></script>
    <script src="manager-ui.js"></script>
    <script src="inline-deployment.js"></script>
    <script src="app.js"></script>
  </body>
</html>
