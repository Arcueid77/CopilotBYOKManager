<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>CopilotBYOKManager</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="installer.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="github-auth.css" />
    <link rel="stylesheet" href="setup-usage.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <strong>CopilotBYOKManager</strong>
            <small>本地 Copilot 配置管理</small>
          </div>
        </div>

        <nav id="primary-nav" aria-label="主导航">
          <button class="nav-item active" data-route="overview" aria-current="page">
            <span>总览</span>
          </button>
          <button class="nav-item" data-route="connections">
            <span>连接</span>
          </button>
          <button class="nav-item" data-route="clients"><span>客户端</span></button>
          <button class="nav-item" data-route="usage"><span>用量</span></button>
          <details class="more-nav"><summary class="nav-item"><span>更多</span></summary><div class="more-menu">
          <button class="nav-item" data-route="resources"><span>资源</span></button>
          <button class="nav-item" data-route="activity">
            <span>活动记录</span>
          </button>
          <button class="nav-item" data-route="settings">
            <span>设置</span>
          </button>
          <button class="nav-item" data-route="about"><span>关于</span></button>
          </div></details>
        </nav>

        <div class="sidebar-footer">
          <div class="runtime-dot"></div>
          <div>
            <strong id="runtime-label">读取状态中</strong>
            <small id="runtime-detail">检查本地后端</small>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">PILOTWEAVE</p>
            <h1 id="page-title">总览</h1>
            <p id="page-subtitle">管理连接，预览后发布。</p>
          </div>
          <div class="topbar-actions">
            <button id="refresh-button" class="button ghost">刷新</button>
            <button id="add-connection-button" class="button primary">添加连接</button>
          </div>
        </header>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="assertive"></div>
    <script src="ui-lifecycle.js"></script>
    <script src="deployment-review.js"></script>
    <script src="installer-ui.js"></script>
    <script src="account-ui.js"></script>
    <script src="github-auth-ui.js"></script>
    <script src="setup-ui.js"></script>
    <script src="jetbrains-ui.js"></script>
    <script src="usage-ui.js"></script>
    <script src="plan-session.js"></script>
    <script src="resources-ui.js"></script>
    <script src="model-discovery.js"></script>
    <script src="manager-ui.js"></script>
    <script src="inline-deployment.js"></script>
    <script src="app.js"></script>
  </body>
</html>
