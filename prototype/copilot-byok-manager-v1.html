<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot BYOK Manager · 交互原型（浏览器演示）</title>
<!--
  Copilot BYOK Manager —— 可交互 HTML 原型
  打开方式：直接双击本文件，或拖入任意现代浏览器（Edge / Chrome / Firefox）。
  无需安装依赖、无需开发服务、无需真实账号或 API Key。
  全部数据为内置模拟数据；不会访问真实服务，也不会对本机执行任何写入。
  建议从顶部横幅的「使用指南」开始，或用「场景」下拉切换空状态、部分成功、预览过期、账号冲突、操作中断等演示状态。
-->
<style>
/* ============ 基础与主题变量 ============ */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#182238; --muted:#5b6b82; --faint:#8a97ab;
  --accent:#4f46e5; --accent-soft:#eef2ff; --accent-hover:#4338ca;
  --ok:#15803d; --ok-soft:#dcfce7; --ok-border:#bbf7d0;
  --warn:#b45309; --warn-soft:#fef3c7; --warn-border:#fde68a;
  --err:#b91c1c; --err-soft:#fee2e2; --err-border:#fecaca;
  --info:#0369a1; --info-soft:#e0f2fe; --info-border:#bae6fd;
  --manual:#7c3aed; --manual-soft:#f3e8ff; --manual-border:#e9d5ff;
  --off:#64748b; --off-soft:#f1f5f9; --off-border:#e2e8f0;
  --sidebar:#141b31; --sidebar-2:#1b2440; --sidebar-text:#aab4cf; --sidebar-active:#ffffff;
  --demo-bg:#fff7e6; --demo-border:#f5c96b; --demo-text:#7c5a10;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(15,23,42,.18);
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --banner-h:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:#c7d2fe}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}
.path{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:#334155;word-break:break-all}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{margin-left:auto} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g12{gap:12px}.g16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hide{display:none!important}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.scroll{overflow:auto}

/* ============ 演示横幅 ============ */
.demo-banner{
  position:fixed;top:0;left:0;right:0;height:var(--banner-h);z-index:60;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:repeating-linear-gradient(-45deg,#fff8e6 0 14px,#fdf0cd 14px 28px);
  border-bottom:1px solid var(--demo-border);color:var(--demo-text);
}
.demo-banner .tag{
  display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap;
}
.demo-banner .desc{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-banner select{
  font-size:12.5px;padding:4px 8px;border:1px solid #e3c878;border-radius:6px;background:#fffdf5;color:#6b5310;
}
.demo-banner .bbtn{
  font-size:12.5px;padding:4px 10px;border:1px solid #e3c878;border-radius:6px;background:#fffdf5;color:#6b5310;white-space:nowrap;
}
.demo-banner .bbtn:hover{background:#fff3d0}

/* ============ 布局骨架 ============ */
.shell{display:flex;min-height:100vh;padding-top:var(--banner-h)}
.sidebar{
  width:216px;flex:none;background:var(--sidebar);color:var(--sidebar-text);
  display:flex;flex-direction:column;position:sticky;top:var(--banner-h);
  height:calc(100vh - var(--banner-h));
}
.logo{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;color:#fff;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-mark{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff}
.logo-name{font-weight:700;font-size:13.5px;line-height:1.2}
.logo-sub{font-size:10.5px;color:#7f8bb0}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-bottom:2px;
  border:none;border-radius:8px;background:transparent;color:var(--sidebar-text);
  font-size:13.5px;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--sidebar-2);color:#dde3f5}
.nav-item.active{background:var(--accent);color:var(--sidebar-active);font-weight:600}
.nav-item svg{flex:none}
.nav-item .nav-hint{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.14);border-radius:9px;padding:0 7px;line-height:18px}
.nav-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#7f8bb0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1240px;margin:0 auto;padding:22px 26px 60px}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;letter-spacing:.2px}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px;max-width:720px}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:14.5px;font-weight:650}
.card-sub{font-size:12.5px;color:var(--muted)}
.card-body{padding:16px}
.card-foot{padding:11px 16px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ============ 徽章（状态必须带文字，不只用颜色） ============ */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:20px;
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.b-err{background:var(--err-soft);color:var(--err);border-color:var(--err-border)}
.b-info{background:var(--info-soft);color:var(--info);border-color:var(--info-border)}
.b-manual{background:var(--manual-soft);color:var(--manual);border-color:var(--manual-border)}
.b-off{background:var(--off-soft);color:var(--off);border-color:var(--off-border)}
.b-neutral{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.b-accent{background:var(--accent-soft);color:var(--accent);border-color:#e0e7ff}
.badge.lg{font-size:12.5px;padding:3px 11px}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-size:13.5px;font-weight:550;
  transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:#94a3b8}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:#fff;border-color:#fca5a5;color:var(--err)}
.btn-danger:hover{background:var(--err-soft)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn-xs{padding:2px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.48;cursor:not-allowed;pointer-events:none}
.btn-lg{padding:9px 20px;font-size:14.5px;border-radius:9px}

/* ============ 表单 ============ */
.field{margin-bottom:14px}
.label{display:block;font-size:12.5px;font-weight:600;color:#37455c;margin-bottom:5px}
.label .req{color:var(--err)}
.input,.select,.textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;
  transition:border-color .12s,box-shadow .12s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
.input:disabled,.select:disabled{background:var(--surface-2);color:var(--muted)}
.textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
input[type=checkbox],input[type=radio]{width:15px;height:15px;accent-color:var(--accent);flex:none}
.kv-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kv-row .input{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg-item{border:none;background:transparent;padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:550}
.seg-item:hover{color:var(--text)}
.seg-item.active{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:650}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.15s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(16px)}

/* ============ 表格 ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{
  text-align:left;font-size:12px;font-weight:650;color:var(--muted);background:var(--surface-2);
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;
}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#f8faff}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}

/* ============ 步骤向导 ============ */
.steps{display:flex;align-items:center;gap:0;margin-bottom:18px;flex-wrap:wrap;row-gap:8px}
.step{display:flex;align-items:center;gap:8px}
.step-num{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;background:var(--surface-2);border:1.5px solid var(--border-strong);color:var(--muted);flex:none;
}
.step.active .step-num{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done .step-num{background:var(--ok);border-color:var(--ok);color:#fff}
.step-label{font-size:13px;font-weight:600;color:var(--muted)}
.step.active .step-label{color:var(--text)}
.step.done .step-label{color:var(--ok)}
.step-bar{width:36px;height:1.5px;background:var(--border-strong);margin:0 10px;flex:none}

/* ============ 连接选择卡 / 模型 chips / 目标行 ============ */
.pick{
  display:block;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--border);
  border-radius:var(--radius);background:#fff;cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.pick:hover{border-color:#a5b4fc}
.pick.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:linear-gradient(0deg,#fbfbff,#fff)}
.pick .pick-name{font-weight:650;font-size:13.5px}
.pick .pick-meta{font-size:12px;color:var(--muted);margin-top:2px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1.5px solid var(--border);
  border-radius:999px;background:#fff;font-size:12.5px;font-weight:550;cursor:pointer;user-select:none;
}
.chip:hover{border-color:#a5b4fc}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .star{color:#d97706}
.chip.disabled{opacity:.5;cursor:not-allowed}
.target-row{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius);background:#fff;margin-bottom:8px;
}
.target-row:hover{border-color:#a5b4fc}
.target-row.disabled{opacity:.62;background:var(--surface-2)}
.target-ic{width:34px;height:34px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}

/* ============ 提示条 / 横幅 ============ */
.alert{
  display:flex;gap:10px;padding:10px 13px;border-radius:var(--radius);border:1px solid;
  font-size:13px;align-items:flex-start;
}
.alert .alert-ic{flex:none;margin-top:1px}
.alert b{font-weight:650}
.a-info{background:var(--info-soft);border-color:var(--info-border);color:#0c4a6e}
.a-warn{background:var(--warn-soft);border-color:var(--warn-border);color:#78350f}
.a-err{background:var(--err-soft);border-color:var(--err-border);color:#7f1d1d}
.a-ok{background:var(--ok-soft);border-color:var(--ok-border);color:#14532d}
.a-neutral{background:var(--off-soft);border-color:var(--off-border);color:#334155}
.recovery-banner{
  display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:16px;
  background:#fff1f2;border:1.5px solid #fda4af;border-radius:var(--radius);color:#881337;
}

/* ============ 模态框 ============ */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;
  align-items:flex-start;justify-content:center;padding:60px 20px 40px;backdrop-filter:blur(2px);
}
.overlay.open{display:flex}
.modal{
  background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;
  max-height:calc(100vh - 110px);display:flex;flex-direction:column;animation:pop .16s ease-out;
}
.modal-lg{max-width:860px}
.modal-sm{max-width:460px}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15.5px;font-weight:700}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px}
.modal-close{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px;border-radius:6px}
.modal-close:hover{background:var(--surface-2);color:var(--text)}

/* ============ 执行进度 ============ */
.progress{height:7px;border-radius:999px;background:var(--off-soft);overflow:hidden;flex:1}
.progress-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.run-item{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--border)}
.run-item:last-child{border-bottom:none}
.run-ic{width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.spin{width:16px;height:16px;border:2.5px solid #c7d2fe;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 空状态 ============ */
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty-ic{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.empty-title{font-size:14.5px;font-weight:650;color:#3c4a63;margin-bottom:4px}
.empty-sub{font-size:12.5px;max-width:420px;margin:0 auto 14px}

/* ============ 统计 / 用量 ============ */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.stat-num{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.src-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;background:#fff;box-shadow:var(--shadow)}
.src-card .src-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.src-card .src-name{font-weight:650;font-size:13.5px}
.cost-card{border-radius:var(--radius);padding:16px 18px;border:1.5px solid;background:#fff}
.cost-official{border-color:#a7f3d0;background:linear-gradient(135deg,#f0fdf7,#fff)}
.cost-est{border-color:#ddd6fe;background:linear-gradient(135deg,#f6f3ff,#fff)}
.cost-num{font-size:24px;font-weight:780;font-variant-numeric:tabular-nums;margin:4px 0 2px}

/* ============ 活动记录 ============ */
.act-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.act-item:last-child{border-bottom:none}
.act-ic{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.act-time{font-size:11.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap;margin-top:3px}

/* ============ Toast ============ */
.toasts{position:fixed;right:18px;top:calc(var(--banner-h) + 12px);z-index:120;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{
  display:flex;gap:9px;align-items:flex-start;background:#111a30;color:#e6eaf5;border-radius:10px;
  padding:11px 14px;font-size:13px;box-shadow:var(--shadow-lg);animation:slidein .18s ease-out;
}
@keyframes slidein{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
.toast .t-ic{flex:none;margin-top:1px}
.toast.t-ok{border-left:3px solid #34d399}
.toast.t-err{border-left:3px solid #f87171}
.toast.t-warn{border-left:3px solid #fbbf24}
.toast.t-info{border-left:3px solid #60a5fa}

/* ============ 其他 ============ */
.list-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;margin-bottom:8px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.diff-line{font-family:var(--mono);font-size:12px;padding:2px 10px;border-radius:5px;margin-bottom:3px;white-space:pre-wrap;word-break:break-all}
.diff-add{background:var(--ok-soft);color:#14532d}
.diff-mod{background:var(--warn-soft);color:#78350f}
.diff-skip{background:var(--off-soft);color:#475569}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;color:#475569}
.step-list{counter-reset:s;margin:8px 0 0;padding-left:4px}
.step-list li{list-style:none;counter-increment:s;position:relative;padding:4px 0 4px 30px;font-size:13px}
.step-list li:before{content:counter(s);position:absolute;left:0;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-bar .field{margin-bottom:0;min-width:130px}
.filter-bar .field .label{margin-bottom:3px}
.next-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;margin-bottom:8px}
.verify-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.verify-cell{border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--surface-2)}
.verify-cell .v-t{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.demo-ctl{border:1px dashed #d9b45c;background:#fffdf3;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#6b5310}
.mcp-path{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);margin-bottom:6px;font-size:12.5px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3ccd9;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a8b4c6;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:1100px){

/* ---------------- 预览指纹与失效判定 ---------------- */
function computeFingerprint(st) {
  const d = st.draft;
  const conn = st.connections.find(c => c.id === d.connId);
  const targets = d.targetIds.slice().sort().map(id => {
    const c = st.clients.find(x => x.id === id);
    return id + ":" + (c ? c.config : "gone");
  });
  return JSON.stringify({
    c: d.connId, rev: conn ? conn.updatedAt : 0,
    m: d.modelIds.slice().sort(), t: targets
  });
}
function previewStale(st) {
  if (!st.preview) return false;
  return st.preview.fingerprint !== computeFingerprint(st);
}
/* 由当前草稿生成预览项（生成时快照） */
function buildPreviewFromDraft(st, atTime) {
  const d = st.draft;
  const conn = st.connections.find(c => c.id === d.connId);
  const models = conn ? conn.models.filter(m => d.modelIds.includes(m.id)) : [];
  const items = d.targetIds.map(tid => {
    const c = st.clients.find(x => x.id === tid);
    if (!c) return null;
    const item = { clientId: c.id, capability: c.capability, changes: [], warnings: [], external: c.config === "external-modified", allowBackupWrite: false, supported: true };
    const mNames = models.map(m => m.name || m.modelId).join("、");
    if (!c.installed) {
      item.supported = false;
      item.warnings.push("客户端未安装，无法写入。可先在「客户端与账号」中预览安装。");
      return item;
    }
    if (c.capability === "unsupported") {
      item.supported = false;
      item.warnings.push("插件版本 " + (c.plugin || "未知") + " 尚未审核，不支持自动写入，将跳过。可手动配置或等待审核。");
      return item;
    }
    if (c.capability === "manual") {
      item.changes.push("不执行任何写入：生成手动配置指引（BYOK 为 App 的手动边界）");
      item.warnings.push("需要你在 Copilot App 设置中手动填写连接信息，完成后回到管理器标记。");
      return item;
    }
    if (c.kind === "vscode") {
      item.changes.push("更新 " + c.label + " 的用户 settings.json：写入连接地址、协议与 " + models.length + " 个模型（" + mNames + "）");
      item.changes.push("API Key 写入系统密钥库并仅保存引用，不以明文进入 settings.json");
      item.changes.push("设置默认模型：" + (models.find(m => m.isDefault) || models[0] || { name: "—" }).name);
    } else if (c.kind === "cli") {
      item.changes.push("写入 ~/.copilot/config.json：连接、协议与默认模型（新会话生效）");
      item.changes.push("API Key 写入系统密钥库并保存引用");
    } else if (c.kind === "jetbrains") {
      item.changes.push("写入 github-copilot.xml：连接与 " + models.length + " 个模型");
      const peers = st.clients.filter(x => x.shareGroup && x.shareGroup === c.shareGroup && x.id !== c.id);
      if (peers.length) item.warnings.push("共享配置：与 " + peers.map(p => p.label).join("、") + " 共用同一个 github-copilot.xml，写入将同时影响这些 IDE。");
      item.warnings.push("写入后需关闭并重新打开 IDE，并在模型选择器中刷新。");
    }
    if (item.external) item.warnings.push("检测到该配置在管理器之外被修改。默认跳过、绝不直接覆盖；如确认要以管理器内容为准，请逐项勾选「备份后覆盖」。");
    return item;
  }).filter(Boolean);
  return { id: uid("pv"), at: atTime || Date.now(), fingerprint: computeFingerprint(st), connName: conn ? conn.name : "—", connId: d.connId, modelIds: d.modelIds.slice(), items };
}

/* ---------------- 账号一致性 ---------------- */
function accountStatus() {
  const seen = {};
  state.clients.forEach(c => { if (c.installed && c.account) seen[c.account.login] = true; });
  const logins = Object.keys(seen);
  if (!logins.length) return { kind: "none", logins };
  if (logins.length > 1) return { kind: "conflict", logins };
  if (state.accountTarget && logins[0] !== state.accountTarget) return { kind: "conflict", logins };
  const lowTrust = state.clients.some(c => c.account && c.account.trust === "low");
  if (lowTrust) return { kind: "confirm", logins };
  return { kind: "consistent", logins };
}

function runInstallTick() {
  const ins = ui.installing;
  if (!ins || !ins.started) return;
  const it = ins.items.find(i => i.status === "queued" && i.selected);
  if (!it) {
    if (!ins.rechecking) {
      ins.rechecking = true;
      renderModal();
      setTimeout(() => {
        ins.rechecking = false; ins.done = true;
        ins.items.forEach(i => {
          const c = state.clients.find(x => x.id === i.clientId);
          if (i.status === "running" || (i.status === "queued" && !i.selected)) i.status = i.selected ? "done" : "skipped";
          if (i.status === "done" && c) { c.installed = true; c.version = c.kind === "cli" ? "0.9.4" : c.kind === "app" ? "1.2.0" : c.kind === "jetbrains" ? "2025.2" : c.version || "1.96.0"; if (c.kind === "jetbrains") { c.plugin = "1.5.61"; c.pluginReviewed = true; c.detail = "2025.2 · 插件 1.5.61（已审核）"; } c.notInstalledNote = ""; c.lastChecked = Date.now(); }
          if (c) c.lastChecked = Date.now();
        });
        const okN = ins.items.filter(i => i.status === "done").length, failN = ins.items.filter(i => i.status === "failed").length;
        addAct("install", "安装缺失组件", failN ? "partial" : okN ? "success" : "info", `完成 ${okN} 项${failN ? `，失败 ${failN} 项` : ""}。安装程序退出后已重新检测确认，未仅凭退出码判定成功。`, { label: "查看客户端", page: "clients" });
        if (ui.modal && ui.modal.name === "install") renderModal(); else render();
      }, 1100);
    }
    return;
  }
  it.status = "running";
  renderModal();
  setTimeout(() => {
    if (!ui.installing || ui.installing !== ins || !ins.started) return;
    const c = state.clients.find(x => x.id === it.clientId);
    if (c && c.kind === "app" && state.scenario === "empty") { it.status = "failed"; it.detail = "下载校验失败（模拟）。可重试或改为手动安装。"; }
    else { it.status = "done"; it.detail = "安装程序退出 · 等待重新检测"; }
    renderModal();
    setTimeout(runInstallTick, 300);
  }, 1000);
}

    <li><b>首次设置流</b>：顶部场景切换为「空状态」，依次体验：预览安装缺失组件（含取消与逐项结果、安装后重新检测）→ 官方登录引导 → 新建连接 → 发布。</li>
    <li><b>账号冲突</b>：切换到「账号冲突」场景，在「客户端与账号」中协调登录。</li>
    <li><b>用量两口径</b>：在「用量与费用」切换日期 / 客户端 / 连接 / 路线筛选；对比「官方金额（权威）」与「API 等价估算（参考）」——两者不可相加；试试导入、清除与停用数据源。</li>
    <li><b>共享资源</b>：编辑一个 MCP 配置，预览发布，观察自动 / 手动 / 不支持的边界与「保留原有内容」说明。</li>
    <li><b>只读恢复</b>：「活动与设置 → 设置 → 模拟数据损坏」，进入只读恢复模式后再从备份恢复。</li>
  </ol>
  <div class="label mt12">演示场景</div>
  <p class="small muted">顶部横幅的「演示场景」下拉可切换：标准 / 空状态 / 部分数据加载失败 / 上次发布部分成功 / 预览已过期 / 账号冲突 / 发布中断待恢复。「重置场景」回到该场景初始状态。</p>`;
  return modalShell("使用指南", body, `<button class="btn btn-primary" data-action="close-modal">开始试用</button>`, "question");
}
function modalConfirm(m) {
  return modalShell(m.title || "确认", `<div class="alert ${m.danger ? "a-warn" : "a-info"}"><span class="alert-ic">${icon("warn", 15)}</span><div>${m.message || ""}</div></div>`,
    `<button class="btn" data-action="close-modal">取消</button><button class="btn ${m.danger ? "btn-danger" : "btn-primary"}" data-action="confirm-ok">${esc(m.confirmLabel || "确认")}</button>`, "warn");
}
function modalCorrupt() {
  return modalShell("模拟数据损坏", `<div class="alert a-warn"><span class="alert-ic">${icon("warn", 15)}</span><div>演示存储损坏后的行为：应用将进入<b>只读恢复模式</b>——所有写操作被禁止，顶部出现恢复横幅，不会静默清空数据继续写入。可随时「从备份恢复」。</div></div>`,
    `<button class="btn" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="do-corrupt">${icon("warn", 13)} 进入只读恢复模式</button>`, "db");
}

const RECOVERY_OK = new Set(["nav", "reset-scenario", "restore-backup", "open-help", "close-modal", "act-expand", "res-tab", "sys-tab", "act-filter", "scenario-change"]);
function doNext(doAction) {
  if (!doAction) return;
  const map = {
    "new-conn": () => startNewConn(),
    "install-all": () => openInstall(state.clients.filter(c => !c.installed)),
    "goto-accounts": () => setTimeout(() => { const cards = $$(".page > .card, .page .grid > .card"); const el = cards[cards.length - 1]; if (el) el.scrollIntoView({ behavior: "smooth" }); }, 60),
    "open-lastrun": () => openModal("lastrun", { size: "lg" }),
    "open-recovery": () => openModal("recovery"),
    "focus-deploy": () => setTimeout(() => { const el = $("#deployCard"); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 60),
    "gen-preview": () => genPreview(),
    "sys-settings": () => { ui.sysTab = "settings"; },
    "refresh-official": () => refreshOfficial()
  };
  if (map[doAction]) map[doAction]();
}
function startNewConn() {
  ui.connEditor = mkConn({ name: "", baseUrl: "" });
  ui.connNew = true; ui.connEditId = null;
  if (state.page !== "connections") state.page = "connections";
  render();
}
function genPreview() {
  const d = state.draft;
  if (!d.connId || !d.modelIds.length) { toast("请先选择连接与至少一个模型", "warn"); return; }
  if (!d.targetIds.length) { toast("请先勾选至少一个目标客户端", "warn"); return; }
  state.preview = buildPreviewFromDraft(state);
  openModal("preview", { size: "lg" });
}
function refreshOfficial() {
  toast("正在刷新官方数据（模拟）…", "info", 1500);
  setTimeout(() => {
    const ok = usageSourcesOk(state.usage.records.length);
    state.usage.sources.official = ok.official;
    if (state.githubAuth.authorized) state.usage.sources.billing = Object.assign(ok.billing, { authorized: true, login: state.githubAuth.login });
    addAct("usage", "刷新官方数据", "success", "Copilot 配额与 GitHub 账单已刷新（模拟）。失败时保留旧数据并标记，不以零值展示。", null);
    toast("官方数据已刷新（模拟）", "ok");
    render();
  }, 900);
}
function openInstall(list) {
  ui.installing = { items: installPlansFor(list), started: false, rechecking: false, done: false };
  openModal("install");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (e.target === $("#overlay")) { if (!(state.run && state.run.status === "running")) closeModal(); return; }
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if (a === "close-modal") { closeModal(); return; }
  if (state.recovery.active && !RECOVERY_OK.has(a)) { toast("只读恢复模式：写入操作已禁止，请先「从备份恢复」。", "err"); return; }
  switch (a) {
    /* 导航与演示控制 */
    case "nav": state.page = el.dataset.page; render(); break;
    case "reset-scenario": loadScenario(state.scenario); toast("场景已重置：" + SCENARIOS[state.scenario].name, "info"); break;
    case "open-help": openModal("help", { size: "lg" }); break;
    case "next-go": { const p = el.dataset.page; if (p) state.page = p; render(); doNext(el.dataset.do); const noRerender = ["new-conn", "install-all", "open-lastrun", "open-recovery", "gen-preview", "goto-accounts", "focus-deploy", "refresh-official"]; if (el.dataset.do && !noRerender.includes(el.dataset.do)) render(); break; }
    /* 工作台草稿 */
    case "draft-conn": {
      state.draft.connId = id;
      const conn = state.connections.find(c => c.id === id);
      state.draft.modelIds = conn ? conn.models.filter(m => m.enabled).map(m => m.id) : [];
      render(); break;
    }
    case "draft-model": {
      const arr = state.draft.modelIds, i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      render(); break;
    }
    case "gen-preview": genPreview(); break;
    case "open-preview": openModal("preview", { size: "lg" }); break;
    case "regen-preview": state.preview = buildPreviewFromDraft(state); openModal("preview", { size: "lg" }); toast("已按当前连接与目标重新生成预览", "ok"); break;
    case "confirm-run": { const sel = $("#injectSel"); const inject = sel ? sel.value : "none"; startRun(inject); break; }
    case "run-interrupt": interruptRun("用户取消（演示模拟）"); break;
    case "open-lastrun": openModal("lastrun", { size: "lg" }); break;
    case "open-recovery": openModal("recovery"); break;
    case "open-manual-guide": openModal("manualGuide"); break;
    case "manual-done": {
      const app = state.clients.find(c => c.kind === "app");
      if (app) { app.config = "managed-current"; }
      addAct("publish", "手动配置确认 · Copilot App", "info", "用户声明已按指引在 App 内完成 BYOK 手动配置。管理器未写入、未验证实际调用，请在 App 中发送测试请求。", null);
      closeModal(); toast("已标记为手动完成（管理器未验证实际调用）", "ok"); render(); break;
    }
    case "focus-deploy": { const elc = $("#deployCard"); if (elc) elc.scrollIntoView({ behavior: "smooth" }); break; }
    /* 恢复 */
    case "recover-retry": {
      const run = state.lastRun; if (!run) break;
      run.items.filter(i => ["failed", "interrupted", "not-run"].includes(i.status)).forEach(i => {
        i.status = "applied"; i.detail = "恢复重试成功 · " + appliedDetail(state.clients.find(c => c.id === i.clientId) || {});
        const c = state.clients.find(x => x.id === i.clientId); if (c && c.capability === "auto") c.config = "managed-current";
      });
      run.status = "done";
      addAct("recovery", "恢复事务 " + (run.txId || run.id), "success", "已重试并完成所有未完成的项。", null);
      closeModal(); toast("恢复重试完成（模拟）", "ok"); render(); break;
    }
    case "recover-rollback": {
      const run = state.lastRun; if (!run) break;
      run.items.filter(i => i.status === "applied").forEach(i => {
        i.status = "rolled-back"; i.detail = "已从备份回滚";
        const c = state.clients.find(x => x.id === i.clientId); if (c) c.config = "managed-changed";
      });
      run.status = "done";
      addAct("recovery", "回滚事务 " + (run.txId || run.id), "success", "已写入的项从备份还原；这些客户端标记为「配置已变化」。", null);
      closeModal(); toast("已回滚（模拟）", "ok"); render(); break;
    }
    /* 连接编辑 */
    case "new-conn": startNewConn(); break;
    case "sel-conn": ui.connEditId = id; ui.connEditor = null; ui.connNew = false; render(); break;
    case "cancel-new-conn": ui.connEditor = null; ui.connNew = false; ui.connEditId = state.connections[0] ? state.connections[0].id : null; render(); break;
    case "save-conn": saveConn(); break;
    case "ask-delete-conn": openModal("deleteConn"); break;
    case "do-delete-conn": deleteConn(); break;
    case "clear-key": { const ed = editorConn(); ed.apiKeySaved = false; render(); toast("已清除保存的密钥（模拟）", "ok"); break; }
    case "hdr-add": editorConn().headers.push({ k: "", v: "" }); render(); break;
    case "hdr-del": editorConn().headers.splice(Number(el.dataset.idx), 1); render(); break;
    case "fetch-models": fetchModels(); break;
    case "model-add": openModal("modelEdit", { modelId: null }); break;
    case "model-edit": openModal("modelEdit", { modelId: id }); break;
    case "model-del": { const ed = editorConn(); ed.models = ed.models.filter(m => m.id !== id); render(); break; }
    case "model-save": saveModel(); break;
    /* 客户端与账号 */
    case "rescan": doRescan(); break;
    case "install-all": openInstall(state.clients.filter(c => !c.installed)); break;
    case "install-one": { const c = state.clients.find(x => x.id === id); openInstall(c ? [c] : []); break; }
    case "install-start": ui.installing.started = true; renderModal(); setTimeout(runInstallTick, 400); break;
    case "install-cancel": { const ins = ui.installing; ins.items.forEach(i => { if (i.status === "queued" || i.status === "running") i.status = "canceled"; }); addAct("install", "安装计划", "interrupted", "用户取消；已完成项保留，已重新检测确认真实状态。", null); runInstallTick(); break; }
    case "sim-external": { const c = state.clients.find(x => x.id === id); if (c) { c.config = "external-modified"; c.lastChecked = Date.now(); addAct("detect", "外部修改检测 · " + c.label, "info", "配置文件在管理器之外被修改。后续发布默认跳过该目标，绝不直接覆盖。", { label: "去工作台", page: "workbench" }); toast("已模拟外部修改：" + c.label, "warn"); render(); } break; }
    case "retry-detect": { const c = state.clients.find(x => x.id === id); if (c) { c.detectError = null; c.lastChecked = Date.now(); toast("重新检测成功（模拟）", "ok"); render(); } break; }
    case "set-target-account": state.accountTarget = el.dataset.login; toast("目标账号设为 @" + state.accountTarget, "ok"); render(); break;
    case "recheck-accounts": {
      toast("正在重新检查各客户端登录状态（模拟）…", "info", 1500);
      setTimeout(() => { state.clients.forEach(c => { if (c.account && c.account.trust === "low") c.account.trust = "medium"; c.lastChecked = Date.now(); }); addAct("detect", "账号一致性检查", "success", "已重新检查全部客户端。", null); render(); }, 900); break;
    }
    case "login-guide": ui.loginGuide = { clientId: id, phase: "steps" }; openModal("loginGuide"); break;
    case "login-done": {
      const g = ui.loginGuide; g.phase = "waiting"; renderModal();
      setTimeout(() => {
        const c = state.clients.find(x => x.id === g.clientId);
        if (c) { c.account = { login: state.accountTarget || "octocat", trust: "high" }; c.lastChecked = Date.now(); }
        g.phase = "done";
        addAct("login", "协调登录 · " + (c ? c.label : ""), "success", "按官方流程完成登录并重新检查确认。管理器未接触凭据。", null);
        renderModal();
      }, 1000); break;
    }
    /* 资源 */
    case "res-tab": ui.resTab = el.dataset.tab; render(); break;
    case "res-add": { const tab = ui.resTab; state.resources[tab].push({ id: uid("res"), name: tab === "mcp" ? "new-mcp-server" : tab === "skills" ? "new-skill" : "new-instruction", type: tab === "mcp" ? "http" : undefined, enabled: true, content: "", note: "" }); render(); break; }
    case "res-save": { const r = state.resources[ui.resTab].find(x => x.id === id); const ta = $(`[data-res-content="${id}"]`); if (r && ta) { r.content = ta.value; toast("资源已保存（未发布）", "ok"); } break; }
    case "res-del": ui.pendingConfirm = { action: "res-del-do", args: { id } }; openModal("confirm", { title: "删除资源", message: "删除该资源定义？已发布到客户端的内容不会被移除。", confirmLabel: "删除", danger: true }); break;
    case "res-preview": openModal("resPreview", { size: "lg" }); break;
    case "res-publish": resPublish(); break;
    /* 用量 */
    case "refresh-official": refreshOfficial(); break;
    case "refresh-prices": state.usage.priceUpdatedAt = Date.now(); addAct("usage", "刷新价格目录", "success", "价格目录已检查：当前仍为 " + PRICES.version + "（模拟）。历史估算保留原价格依据。", null); toast("价格目录已是最新：" + PRICES.version, "ok"); render(); break;
    case "usage-import": usageImport(); break;
    case "usage-clear": openModal("clearUsage"); break;
    case "usage-clear-do": { state.usage.records = []; state.usage.sources.local = { enabled: true, status: "successful-empty", count: 0, range: null, note: "已清除，暂无记录" }; addAct("usage", "清除已导入记录", "success", "已删除管理器导入的全部本地使用统计；不影响客户端自身数据。", null); closeModal(); toast("已清除导入记录", "ok"); render(); break; }
    case "consent-on": state.usage.consent = true; addAct("settings", "开启本地用量采集", "info", "用户明确同意。仅保存统计元数据。", null); toast("已开启（仅元数据）", "ok"); render(); break;

    case "sys-tab": ui.sysTab = el.dataset.tab; render(); break;
    case "act-filter": ui.actFilter = el.dataset.t; render(); break;
    case "act-expand": ui.expandedAct[id] = !ui.expandedAct[id]; render(); break;
    case "auth-github": state.githubAuth = { authorized: true, login: state.accountTarget || "octocat" }; state.usage.sources.billing.authorized = true; if (state.usage.sources.billing.status === "unauthorized") state.usage.sources.billing = { enabled: true, status: "missing", authorized: true, login: state.githubAuth.login, note: "已授权，点击「刷新官方数据」获取" }; addAct("auth", "GitHub 独立授权（账单/用量）", "success", "OAuth 完成（模拟）。与客户端登录相互独立。", null); toast("授权完成（模拟）", "ok"); render(); break;
    case "revoke-github": ui.pendingConfirm = { action: "revoke-github-do", args: {} }; openModal("confirm", { title: "解除独立授权", message: "解除后无法读取 GitHub 官方个人账单（显示为「不可用」，不会显示为零）。各客户端登录不受影响。", confirmLabel: "解除授权", danger: true }); break;
    case "sim-corrupt": openModal("corrupt"); break;
    case "do-corrupt": state.recovery = { active: true, reason: "manager.db 校验和不匹配（模拟）" }; addAct("recovery", "存储完整性检查", "failed", "检测到本地数据损坏，进入只读恢复模式。已停止一切写入。", null); closeModal(); render(); break;
    case "restore-backup": state.recovery = { active: false }; addAct("recovery", "从备份恢复", "success", "已从最近一代备份还原 manager.db（模拟），退出只读恢复模式。", null); toast("已从备份恢复", "ok"); render(); break;
    case "confirm-ok": {
      const p = ui.pendingConfirm; ui.pendingConfirm = null; closeModal();
      if (p && p.action === "res-del-do") { state.resources[ui.resTab] = state.resources[ui.resTab].filter(x => x.id !== p.args.id); toast("资源已删除", "ok"); render(); }
      if (p && p.action === "revoke-github-do") { state.githubAuth = { authorized: false }; state.usage.sources.billing = { enabled: true, status: "unauthorized", authorized: false, note: "需要管理器独立授权" }; addAct("auth", "解除 GitHub 独立授权", "info", "账单数据将不再获取，显示为「不可用」。", null); render(); }
      break;
    }
  }
});
/* change 事件（表单、筛选、开关） */
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "scenarioSel") { loadScenario(el.value); toast("已切换场景：" + SCENARIOS[el.value].name, "info"); return; }
  if (state.recovery.active && !el.closest(".demo-banner")) { toast("只读恢复模式：修改未生效。", "err"); render(); return; }
  const ca = el.dataset.actionChange;
  if (ca === "draft-target") { const arr = state.draft.targetIds, i = arr.indexOf(el.dataset.id); if (el.checked && i < 0) arr.push(el.dataset.id); if (!el.checked && i >= 0) arr.splice(i, 1); render(); return; }
  if (ca === "pv-backup-write" && state.preview) { const it = state.preview.items.find(x => x.clientId === el.dataset.id); if (it) it.allowBackupWrite = el.checked; renderModal(); return; }
  if (ca === "model-enable") { const m = editorConn().models.find(x => x.id === el.dataset.id); if (m) { m.enabled = el.checked; if (!m.enabled && m.isDefault) m.isDefault = false; } render(); return; }
  if (ca === "model-default") { editorConn().models.forEach(m => m.isDefault = m.id === el.dataset.id); render(); return; }
  if (ca === "inst-toggle") { ui.installing.items[Number(el.dataset.idx)].selected = el.checked; return; }
  if (ca === "res-enable") { const r = state.resources[el.dataset.tab].find(x => x.id === el.dataset.id); if (r) r.enabled = el.checked; return; }
  if (ca === "src-toggle") { const s = state.usage.sources[el.dataset.src]; s.enabled = el.checked; toast(el.checked ? "数据源已启用" : "数据源已停用（数据保留，不参与统计）", "info"); render(); return; }
  if (ca === "consent-toggle") { state.usage.consent = el.checked; addAct("settings", el.checked ? "开启本地用量采集" : "关闭本地用量采集", "info", el.checked ? "用户明确同意。仅保存统计元数据。" : "已停止导入；已导入数据保留，可在用量页清除。", null); render(); return; }
  if (el.dataset.filter) { ui.usageFilters[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.field !== undefined && editorConn()) { const ed = editorConn(); if (el.dataset.field === "apiKeyDraft") { ed.apiKeyDraft = el.value; } else ed[el.dataset.field] = el.value; return; }
  if (el.dataset.hdrK !== undefined) { editorConn().headers[Number(el.dataset.hdrK)].k = el.value; return; }
  if (el.dataset.hdrV !== undefined) { editorConn().headers[Number(el.dataset.hdrV)].v = el.value; return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.modal && !(state.run && state.run.status === "running")) closeModal(); });

/* ---------------- 连接保存 / 模型保存 / 删除 / 获取模型 ---------------- */
function saveConn() {
  const ed = editorConn();
  if (!ed.name.trim()) { toast("连接名称不能为空", "err"); return; }
  if (!/^https?:\/\/.+/.test(ed.baseUrl.trim())) { toast("接口地址需以 http(s):// 开头", "err"); return; }
  ed.headers = ed.headers.filter(h => h.k.trim());
  if (ed.apiKeyDraft && ed.apiKeyDraft.trim()) { ed.apiKeySaved = true; }
  delete ed.apiKeyDraft; /* 密钥不落状态、不回显 */
  if (ed.models.length && !ed.models.some(m => m.isDefault && m.enabled)) { const f = ed.models.find(m => m.enabled); if (f) f.isDefault = true; }
  ed.updatedAt = Date.now();
  if (ui.connNew) { state.connections.push(ed); addAct("settings", "新建连接「" + ed.name + "」", "info", "已保存（未发布）。保存连接不等于发布配置。", { label: "去工作台发布", page: "workbench" }); }
  else {
    const i = state.connections.findIndex(c => c.id === ed.id);
    if (i >= 0) state.connections[i] = ed;
    addAct("settings", "编辑连接「" + ed.name + "」", "info", "已保存（未发布）。此前生成的部署预览如涉及该连接已失效，需重新预览。", { label: "去工作台", page: "workbench" });
  }
  ui.connNew = false; ui.connEditId = ed.id; ui.connEditor = null;
  toast("连接已保存（未发布）。修改需重新预览部署。", "ok");
  render();
}
function saveModel() {
  const ed = editorConn();
  const em = ui.editingModel;
  const val = id => ($("#" + id) ? $("#" + id).value : "");
  const chk = id => ($("#" + id) ? $("#" + id).checked : false);
  const modelId = val("fm-modelId").trim();
  if (!modelId) { toast("模型 ID 不能为空", "err"); return; }
  const data = { modelId, name: val("fm-name").trim() || modelId, ctx: Number(val("fm-ctx")) || null, maxOut: Number(val("fm-maxout")) || null, enabled: chk("fm-enabled"), isDefault: chk("fm-default"), caps: { tool: chk("fm-tool"), vision: chk("fm-vision"), reason: chk("fm-reason") } };
  if (em.isNew) ed.models.push(mkModel(Object.assign({ id: em.id }, data)));
  else { const m = ed.models.find(x => x.id === em.id); if (m) Object.assign(m, data); }
  if (data.isDefault) ed.models.forEach(m => { if (m.id !== em.id) m.isDefault = false; });
  closeModal(); render(); toast("模型已保存（未发布）", "ok");
}
function deleteConn() {
  const ed = editorConn();
  const mode = ($('input[name="delMode"]:checked') || {}).value || "revoke";
  const managed = state.clients.filter(c => c.installed && (c.config === "managed-current" || c.config === "managed-changed") && c.capability === "auto");
  if (mode === "revoke") managed.forEach(c => { c.config = "not-configured"; });
  state.connections = state.connections.filter(c => c.id !== ed.id);
  if (state.draft.connId === ed.id) state.draft = { connId: state.connections[0] ? state.connections[0].id : null, modelIds: [], targetIds: state.draft.targetIds };
  if (state.preview && state.preview.connId === ed.id) state.preview = null;
  addAct("settings", "删除连接「" + ed.name + "」", "info", mode === "revoke" ? `已先撤销 ${managed.length} 个客户端中由本软件管理的配置，再删除连接。` : "仅停止管理；客户端已有配置保留，之后将被视为外部内容。", null);
  ui.connEditor = null; ui.connNew = false; ui.connEditId = state.connections[0] ? state.connections[0].id : null;
  closeModal(); toast(mode === "revoke" ? "已撤销受管配置并删除连接（模拟）" : "已删除连接，客户端配置保留", "ok");
  render();
}
function fetchModels() {
  const ed = editorConn();
  if (!ed.baseUrl.trim()) { toast("请先填写接口地址", "warn"); return; }
  ui.fetchModels = { running: true };
  render();
  setTimeout(() => {
    const pool = ed.baseUrl.includes("11434")
      ? [{ modelId: "qwen3-max", name: "Qwen3 Max", caps: { tool: true, vision: false, reason: false }, ctx: 131072, maxOut: 8192 }, { modelId: "llama4-scout", name: "Llama 4 Scout", caps: { tool: true, vision: true, reason: false }, ctx: 131072, maxOut: 8192 }]
      : [{ modelId: "claude-sonnet-5-20251015", name: "Claude Sonnet 5（最新快照）", caps: { tool: true, vision: true, reason: true }, ctx: 200000, maxOut: 64000 }, { modelId: "gpt-5-mini", name: "GPT-5 Mini", caps: { tool: true, vision: true, reason: false }, ctx: 128000, maxOut: 16384 }, { modelId: "claude-opus-5.1", name: "Claude Opus 5.1", caps: { tool: true, vision: true, reason: true }, ctx: 200000, maxOut: 64000 }];
    let added = 0, existed = 0;
    pool.forEach(p => {
      if (ed.models.some(m => m.modelId === p.modelId)) { existed++; return; }
      ed.models.push(mkModel(Object.assign({ enabled: false }, p))); added++;
    });
    ui.fetchModels = null;
    toast(`获取完成（模拟）：新增 ${added} 个，已存在 ${existed} 个。未发送聊天请求。`, "ok", 4200);
    render();
  }, 1200);
}
function doRescan() {
  ui.scanning = true; render();
  setTimeout(() => {
    ui.scanning = false;
    state.clients.forEach(c => { c.lastChecked = Date.now(); if (c.detectError && state.scenario !== "load-failure") c.detectError = null; });
    addAct("detect", "环境检测完成", "success", "重新检测 " + state.clients.length + " 个客户端实例（模拟）。", null);
    toast("检测完成（模拟）", "ok");
    render();
  }, 1300);
}
function usageImport() {
  const rnd = mulberry32(Date.now() % 2147483647);
  const added = [];
  for (let i = 0; i < 16; i++) {
    const byok = rnd() < 0.7;
    added.push({
      id: uid("u"), ts: Date.now() - Math.floor(rnd() * 20 * 3600e3),
      clientId: ["cli", "vs-stable", "jb-idea"][Math.floor(rnd() * 3)],
      connId: byok ? "conn-galaxy" : null, model: byok ? "claude-sonnet-5" : "gpt-5",
      route: byok ? "byok" : "official", confidence: byok ? "identity" : "explicit",
      requests: 1 + Math.floor(rnd() * 5), sessions: 1, input: Math.floor(3e3 + rnd() * 50e3), output: Math.floor(800 + rnd() * 8e3),
      cacheRead: Math.floor(rnd() * 20e3), cacheWrite: Math.floor(rnd() * 5e3), quality: "complete"
    });
  }
  state.usage.records = added.concat(state.usage.records);
  state.usage.sources.local = { enabled: true, status: "available", count: state.usage.records.length, range: "2026-09-28 ~ 2026-10-11", note: "从支持的本地来源导入 · 仅统计元数据" };
  addAct("usage", "导入本地用量记录", "success", "新导入 " + added.length + " 条（模拟）。仅保存元数据（模型、Token、时间），不含提示词或代码。", null);
  toast("已导入 " + added.length + " 条本地记录（模拟）", "ok");
  render();
}
function resPublish() {
  const tab = ui.resTab;
  const list = (state.resources[tab] || []).filter(r => r.enabled);
  const targets = resTargets(tab);
  const results = [];
  targets.forEach(t => {
    const c = state.clients.find(x => x.id === t.clientId);
    const writable = list.filter(r => !(tab === "mcp" && r.type === "command"));
    if (t.support === "auto" && writable.length && c && c.installed) results.push({ target: c.label, status: "success", detail: `合并写入 ${writable.length} 项（保留原有内容）` });
    else if (t.support === "manual") results.push({ target: clientName(state, t.clientId), status: "manual", detail: "需在客户端设置中手动配置" });
    else if (t.support === "unsupported") results.push({ target: clientName(state, t.clientId), status: "skipped", detail: "不支持该资源类型" });
    else results.push({ target: clientName(state, t.clientId), status: "skipped", detail: "无可自动发布的内容" });
  });
  state.resPublish = { at: Date.now(), tab, results };
  addAct("resource", "发布共享资源 · " + RES_TABS[tab].name.split("（")[0], results.some(r => r.status !== "success") ? "partial" : "success",
    results.map(r => `${r.target}：${r.detail}`).join("；") + "。未将所有客户端标记为已同步。", { label: "查看资源", page: "resources" });
  closeModal(); toast("资源发布完成（部分目标需手动，见结果）", "ok");
  render();
}

loadScenario("standard");
