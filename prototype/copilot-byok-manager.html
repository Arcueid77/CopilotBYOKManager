<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYOK Manager · 交互原型（演示）</title>
<!--
  Copilot BYOK Manager —— 可交互 HTML 原型（简洁版）
  打开方式：直接双击本文件，或拖入任意现代浏览器。
  无需依赖、服务、账号或真实 API Key；全部数据为模拟，不执行任何本机写入。
  顶部细条可切换演示场景（空状态 / 部分成功 / 预览过期 / 账号冲突 / 中断恢复…）与重置。
-->
<style>
/* ============ 基础 ============ */
:root{
  --bg:#fafbfc; --surface:#fff; --border:#eceef1; --border-2:#dde1e7;
  --text:#1f2430; --muted:#667085; --faint:#9aa4b2;
  --accent:#4f46e5; --accent-soft:#eef0fe; --accent-hover:#4338ca;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#0284c7; --manual:#7c3aed; --off:#94a3b8;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);
  --shadow-lg:0 16px 44px rgba(15,23,42,.16);
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --strip-h:36px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
::selection{background:#c7d2fe}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
code,.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.g4{gap:4px}.g6{gap:6px}.g12{gap:12px}.g16{gap:16px}
.wrap-x{flex-wrap:wrap}
.right{margin-left:auto} .grow{flex:1;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hide{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
.path{font-family:var(--mono);font-size:12px;background:#f4f5f7;border-radius:5px;padding:1px 6px;color:#475569;word-break:break-all}

/* ============ 顶部：演示条 + 导航 ============ */
.demo-strip{
  position:fixed;top:0;left:0;right:0;height:var(--strip-h);z-index:60;
  display:flex;align-items:center;gap:10px;padding:0 16px;font-size:12px;
  background:#fffbeb;border-bottom:1px solid #f5e6bd;color:#8a6116;
}
.demo-strip select{font-size:12px;padding:2px 6px;border:1px solid #e8d9ac;border-radius:6px;background:#fffdf4;color:#7c5a10}
.demo-strip .sbtn{font-size:12px;padding:2px 9px;border:1px solid #e8d9ac;border-radius:6px;background:#fffdf4;color:#7c5a10}
.demo-strip .sbtn:hover{background:#fdf0cd}
.topbar{
  position:sticky;top:var(--strip-h);z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-in{display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:15px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center}
.brand .proto{font-size:10.5px;font-weight:600;color:var(--faint);border:1px solid var(--border-2);border-radius:5px;padding:0 5px}
.tabs{display:flex;gap:2px}
.tabs button{
  border:none;background:transparent;font-size:14px;color:var(--muted);padding:7px 13px;border-radius:8px;font-weight:550;
  border-bottom:2px solid transparent;border-radius:8px 8px 0 0;
}
.tabs button:hover{color:var(--text);background:#f4f5f7}
.tabs button.on{color:var(--accent);font-weight:650;border-bottom-color:var(--accent);border-radius:0}
main{padding:34px 0 90px}

/* ============ 排版 ============ */
h1{font-size:24px;font-weight:750;letter-spacing:.2px}
.lede{color:var(--muted);font-size:14px;margin:6px 0 24px;max-width:640px}
.sec{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--faint);margin:0 0 10px}

/* ============ 卡片 ============ */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.card + .card{margin-top:16px}
.card-title{font-size:15px;font-weight:700}
.soft{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}

/* ============ 状态：小圆点 + 一句话 ============ */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.st-ok{color:#15803d}.st-ok:before{background:var(--ok)}
.st-warn{color:#b45309}.st-warn:before{background:var(--warn)}
.st-err{color:#b91c1c}.st-err:before{background:var(--err)}
.st-manual{color:#6d28d9}.st-manual:before{background:var(--manual)}
.st-info{color:#0369a1}.st-info:before{background:var(--info)}
.st-off{color:var(--faint)}.st-off:before{background:#cbd5e1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;background:#f4f5f7;color:var(--muted);white-space:nowrap}
.pill-key{background:#ecfdf3;color:#15803d}
.pill-acc{background:var(--accent-soft);color:var(--accent)}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 15px;border-radius:10px;border:1px solid var(--border-2);
  background:#fff;color:var(--text);font-size:13.5px;font-weight:550;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:#b6bfca;background:#fafbfc}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:#f4f5f7;color:var(--text);border-color:transparent}
.btn-danger{background:#fff;border-color:#f3c2c2;color:var(--err)}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:2px 9px;font-size:12px;border-radius:7px}
.btn-lg{padding:11px 26px;font-size:15px;border-radius:11px;font-weight:650}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}

/* ============ 表单 ============ */
.f{margin-bottom:16px}
.f label{display:block;font-size:12.5px;font-weight:600;color:#3d4757;margin-bottom:5px}
.input,.select,.textarea{
  width:100%;padding:8px 11px;border:1px solid var(--border-2);border-radius:10px;background:#fff;transition:.12s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.textarea{min-height:88px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
input[type=checkbox],input[type=radio]{width:15px;height:15px;accent-color:var(--accent);flex:none}
details.adv{border:1px dashed var(--border-2);border-radius:10px;padding:10px 14px;margin:4px 0 16px}
details.adv summary{font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
details.adv[open] summary{margin-bottom:12px;color:var(--text)}
.kv{display:flex;gap:8px;margin-bottom:8px}
.kv .input{flex:1}
.seg{display:inline-flex;background:#f2f4f7;border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 15px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:550}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:650}
.switch{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.15s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(15px)}

/* ============ 首页流程 ============ */
.flowline{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint);margin-bottom:20px;flex-wrap:wrap}
.flowline .fl-n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:5px}
.flowline .on{color:var(--text);font-weight:650}
.flowline .on .fl-n{border-color:var(--accent);background:var(--accent);color:#fff}
.flowline .sep{color:var(--border-2)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pillc{
  border:1.5px solid var(--border-2);border-radius:11px;background:#fff;padding:9px 14px;text-align:left;transition:.12s;
}
.pillc:hover{border-color:#b9c2fe}
.pillc.on{border-color:var(--accent);background:var(--accent-soft)}
.pillc .pc-name{font-weight:650;font-size:13.5px;display:block}
.pillc .pc-sub{font-size:11.5px;color:var(--muted)}
.mchip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1.5px solid var(--border-2);
  border-radius:999px;background:#fff;font-size:12.5px;font-weight:550;
}
.mchip:hover{border-color:#b9c2fe}
.mchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mchip.off{opacity:.45}
.mchip .star{color:#d97706}
.trow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:none}
.trow.dim{opacity:.55}
.trow .tic{width:32px;height:32px;flex:none;border-radius:9px;background:#f4f5f7;color:var(--muted);display:flex;align-items:center;justify-content:center}
.trow .tname{font-weight:600;font-size:13.5px}
.trow .tsub{font-size:11.5px;color:var(--faint)}

/* ============ 提示条 ============ */
.note{display:flex;gap:10px;padding:11px 14px;border-radius:11px;font-size:13px;align-items:flex-start}
.n-info{background:#f0f9ff;color:#0c4a6e}
.n-warn{background:#fffbeb;color:#92400e}
.n-err{background:#fef2f2;color:#991b1b}
.n-ok{background:#f0fdf4;color:#166534}
.n-plain{background:#f6f7f9;color:var(--muted)}
.note .nic{flex:none;margin-top:2px}
.banner-inline{
  display:flex;gap:12px;align-items:center;padding:13px 16px;margin-bottom:20px;
  background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#991b1f;font-size:13.5px;
}

/* ============ 表格 ============ */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.tbl th{text-align:left;font-size:11.5px;font-weight:650;color:var(--faint);padding:9px 13px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fafbfc}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}

/* ============ 模态 / 进度 / toast ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:64px 20px 40px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;max-height:calc(100vh - 120px);display:flex;flex-direction:column;animation:pop .15s ease-out}
.modal.lg{max-width:760px}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--border)}
.m-title{font-size:15px;font-weight:700}
.m-body{padding:20px 22px;overflow-y:auto}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.m-close{border:none;background:transparent;color:var(--faint);font-size:17px;padding:4px;border-radius:6px}
.m-close:hover{color:var(--text);background:#f4f5f7}
.progress{height:6px;border-radius:999px;background:#eef0f3;overflow:hidden;flex:1}
.progress-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.spin{width:15px;height:15px;border:2.5px solid #d3d9fb;border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;flex:none;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.ritem{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.ritem:last-child{border-bottom:none}
.ric{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:var(--muted)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{display:flex;gap:9px;align-items:flex-start;background:#1f2430;color:#eef0f5;border-radius:11px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow-lg);animation:slin .18s ease-out}
@keyframes slin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.demo-ctl{border:1px dashed #e3cd90;background:#fffdf3;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#7c5a10}

/* ============ 用量 ============ */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.statx .n{font-size:22px;font-weight:760;font-variant-numeric:tabular-nums}
.statx .l{font-size:12px;color:var(--faint)}
.srcard{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff}
.cost{border-radius:12px;padding:16px 18px;border:1px solid var(--border);background:#fff}
.cost .n{font-size:22px;font-weight:760;font-variant-numeric:tabular-nums;margin:2px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .f{margin:0;min-width:124px}
.filters .f label{margin-bottom:3px}

/* ============ 快速切换（首页） ============ */
.conn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.conn-card{border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff;transition:border-color .12s,box-shadow .12s}
.conn-card:hover{border-color:#b9c2fe}
.conn-card.live{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.09)}
.conn-card .cc-name{font-weight:700;font-size:14px}
.preview-panel{border:1.5px solid var(--accent);border-radius:12px;padding:16px 18px;background:#fbfbff;margin-top:16px}
.preview-panel.stale{border-color:#f3c2c2;background:#fffafa}
.live-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.live-row:last-child{border-bottom:none}
.live-arrow{color:var(--faint)}
@media (max-width:820px){ .conn-grid{grid-template-columns:1fr} }

/* ============ 其他 ============ */
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .et{font-size:14.5px;font-weight:650;color:#3d4757;margin-bottom:4px}
.empty .es{font-size:12.5px;max-width:400px;margin:0 auto 14px}
.arow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start;font-size:13px}
.arow:last-child{border-bottom:none}
.atime{font-size:11px;color:var(--faint);font-family:var(--mono);white-space:nowrap;margin-top:2px}
.steplist{counter-reset:s;margin-top:6px}
.steplist li{list-style:none;counter-increment:s;position:relative;padding:4px 0 4px 29px;font-size:13.5px}
.steplist li:before{content:counter(s);position:absolute;left:0;top:4px;width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.diff{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:6px;margin-bottom:4px;white-space:pre-wrap;word-break:break-all}
.diff-a{background:#f0fdf4;color:#166534}
.diff-m{background:#fffbeb;color:#92400e}
.diff-s{background:#f6f7f9;color:#667085}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){
  .grid2,.grid3,.f2,.statrow{grid-template-columns:1fr 1fr}
  .brand .bname{display:none}
  .demo-strip .hide-s{display:none}
  main{padding:24px 0 70px}
}
</style>
</head>
<body>

<div class="demo-strip">
  <b>演示模式</b><span class="hide-s">· 全部为模拟数据，不会改动你的电脑</span>
  <span class="right"></span>
  <select id="scenarioSel" title="切换演示场景"></select>
  <button class="sbtn" data-action="reset-scenario">重置</button>
  <button class="sbtn" data-action="open-help">指南</button>
</div>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="brand-mark" id="logoMark"></span><span class="bname">BYOK Manager</span><span class="proto">原型</span></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main><div class="wrap" id="banner"></div><div class="wrap" id="page"></div></main>

<div class="overlay" id="overlay"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* ================================================================
   BYOK Manager — 交互原型（简洁版 · 浏览器演示）
   全部数据模拟；无任何真实网络 / 文件 / 进程操作。
   ================================================================ */

/* ---------------- 工具 ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => (p || "id") + "-" + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const fmtInt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
function fmtTok(n){ if(n==null) return "—"; if(n>=1e6) return (n/1e6).toFixed(2)+"M"; if(n>=1e3) return (n/1e3).toFixed(1)+"k"; return String(n); }
function fmtMoney(n){ if(n==null) return "不可用"; return "$"+Number(n).toFixed(2); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtTime(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function ago(ts){
  const s=(Date.now()-ts)/1e3;
  if(s<60) return "刚刚";
  if(s<3600) return Math.floor(s/60)+" 分钟前";
  if(s<86400) return Math.floor(s/3600)+" 小时前";
  return Math.floor(s/86400)+" 天前";
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- 图标（内联 SVG） ---------------- */
const ICONS = {
  bolt:'<path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z"/>',
  check:'<path d="m4.5 12.5 5 5 10-11"/>',

/* ---------------- 预览 ---------------- */
function computeFingerprint(st8) {
  const d = st8.draft;
  const conn = st8.connections.find(c => c.id === d.connId);
  const targets = d.targetIds.slice().sort().map(id => {
    const c = st8.clients.find(x => x.id === id);
    return id + ":" + (c ? c.config : "gone");
  });
  return JSON.stringify({ c: d.connId, rev: conn ? conn.updatedAt : 0, m: d.modelIds.slice().sort(), t: targets });
}
function previewStale(st8) {
  if (!st8.preview) return false;
  return st8.preview.fingerprint !== computeFingerprint(st8);
}
function buildPreviewFromDraft(st8, atTime) {
  const d = st8.draft;
  const conn = st8.connections.find(c => c.id === d.connId);
  const models = conn ? conn.models.filter(m => d.modelIds.includes(m.id)) : [];
  const items = d.targetIds.map(tid => {
    const c = st8.clients.find(x => x.id === tid);
    if (!c) return null;
    const item = { clientId: c.id, capability: c.capability, changes: [], warnings: [], external: c.config === "external-modified", allowBackupWrite: false, supported: true };
    const defM = models.find(m => m.isDefault) || models[0];
    if (!c.installed) {
      item.supported = false;
      item.warnings.push("未安装，将跳过");
      return item;
    }
    if (c.capability === "unsupported") {
      item.supported = false;
      item.warnings.push("插件版本未审核，不支持自动写入，将跳过");
      return item;
    }
    if (c.capability === "manual") {
      item.changes.push("不写入：生成手动配置指引（你在 App 内自行添加该供应商）");
      item.warnings.push("已调研：App 的配置是不透明私有存储，没有可写的文档化目标，故保持手动；发布后仍需在 App 的模型选择器里选用");
      return item;
    }
    if (c.kind === "vscode") {
      item.changes.push(`新增/更新供应商组「${conn ? conn.name : ""}」：${models.length} 个模型进入模型选择器（保留其他来源）；Key 存系统密钥库`);
      item.warnings.push("发布 ≠ 被选中：请在 VS Code 的模型选择器里选用新模型");
    }
    else if (c.kind === "cli") {
      const cur = (c.boundConns || [])[0];
      const curConn = cur ? st8.connections.find(x => x.id === cur.connId) : null;
      item.changes.push(`写入用户环境变量 COPILOT_PROVIDER_BASE_URL / PROVIDER_TYPE / API_KEY 引用 + COPILOT_MODEL=${defM ? defM.modelId : "…"}（Key 存系统密钥库）`);
      item.warnings.push(`排他切换：自定义供应商生效期间 GitHub 官方模型不可用${curConn && conn && curConn.id !== conn.id ? `；将替换当前「${curConn.name}」` : ""}；重启终端会话后生效`);
    }
    else if (c.kind === "jetbrains") {
      item.changes.push(`新增/更新供应商组：${models.length} 个模型进入选择器（保留其他来源）`);
      item.warnings.push("每个 JetBrains IDE 配置路径独立，各写各的；写完重启该 IDE 并在选择器刷新");
    }
    if (item.external) item.warnings.push("配置在管理器之外被改过：默认跳过、不覆盖；确认后才备份覆盖");
    return item;
  }).filter(Boolean);
  return { id: uid("pv"), at: atTime || Date.now(), fingerprint: computeFingerprint(st8), connName: conn ? conn.name : "—", connId: d.connId, modelIds: d.modelIds.slice(), items };
}

/* ---------------- 账号一致性 ---------------- */
function accountStatus() {
  const seen = {};
  state.clients.forEach(c => { if (c.installed && c.account) seen[c.account.login] = true; });
  const logins = Object.keys(seen);
  if (!logins.length) return { kind: "none", logins };
  if (logins.length > 1) return { kind: "conflict", logins };
  if (state.accountTarget && logins[0] !== state.accountTarget) return { kind: "conflict", logins };
  if (state.clients.some(c => c.account && c.account.trust === "low")) return { kind: "confirm", logins };
  return { kind: "consistent", logins };
}
function clientName(st8, id) { const c = st8.clients.find(x => x.id === id); return c ? c.label : id; }
function connName(st8, id) { const c = st8.connections.find(x => x.id === id); return c ? c.name : "—"; }
function clientStatus(c) {
  if (!c.installed) return ["off", "未安装"];
  if (c.detectError) return ["err", "检测失败"];
  if (c.config === "external-modified") return ["err", "配置被外部修改"];
  if (c.capability === "unsupported") return ["off", "不支持自动写入"];
  if (c.config === "managed-changed") return ["warn", "配置已变化"];
  if (c.config === "not-configured") return c.capability === "manual" ? ["manual", "需手动配置"] : ["off", "未配置"];
  return ["ok", "已发布"];
}
/* 各客户端已发布的来源（多供应商共存；CLI 排他，至多一条） */
function liveBindings() {
  return state.clients.filter(c => c.installed && c.boundConns && c.boundConns.length).map(c => {
    const groups = c.boundConns.map(b => {
      const conn = state.connections.find(x => x.id === b.connId);
      const m = conn ? (conn.models.find(x => x.id === b.modelId) || conn.models.find(x => x.isDefault) || conn.models[0]) : null;
      return { conn, m };
    });
    return { c, groups };
  });
}

function backupPathFor(c) {
  const tag = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "").slice(0, 12);
  if (c.kind === "vscode") return `%APPDATA%\\Code\\User\\chatLanguageModels.json.bak-${tag}`;
  if (c.kind === "cli") return `%APPDATA%\\CopilotByokManager\\backups\\cli-env-${tag}.json（环境变量快照）`;
  if (c.kind === "jetbrains") return `%APPDATA%\\JetBrains\\…\\github-copilot.xml.bak-${tag}`;
  return "";
}
function appliedDetail(c) {
  if (c.kind === "vscode") return "已写入供应商组（保留其他来源）· 请在模型选择器选用";
  if (c.kind === "cli") return "已写入用户环境变量 · 重启终端会话后生效";
  if (c.kind === "jetbrains") return "已写入该 IDE 自己的配置 · 需重启并在选择器刷新";

}
function startRun(inject) {
  const pv = state.preview;
  if (!pv) return;
  if (previewStale(state)) { toast("预览已过期，请重新生成", "warn"); return; }
  const pvConn = state.connections.find(c => c.id === pv.connId);
  const defM = pvConn ? (pvConn.models.find(m => m.isDefault && pv.modelIds.includes(m.id)) || pvConn.models.find(m => pv.modelIds.includes(m.id))) : null;
  state.run = {
    id: uid("run"), at: Date.now(), connName: pv.connName, connId: pv.connId, defModelId: defM ? defM.id : null, status: "running", inject: inject || "none",
    txId: "tx-" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6),
    items: pv.items.map(it => ({ clientId: it.clientId, capability: it.capability, supported: it.supported, external: it.external, allowBackupWrite: it.allowBackupWrite, status: "queued", detail: "等待", shared: [] })),
    recovery: null
  };
  ui.runSim = { i: 0 };
  openModal("run", { size: "lg" });
  setTimeout(runTick, 500);
}
function runTick() {
  const run = state.run, sim = ui.runSim;
  if (!run || run.status !== "running" || !sim) return;
  if (sim.i >= run.items.length) { finishRun(); return; }
  const item = run.items[sim.i];
  const client = state.clients.find(c => c.id === item.clientId);
  const rr = () => { if (ui.modal && ui.modal.name === "run") renderModal(); };
  if (!client || !item.supported) {
    item.status = "skipped"; item.detail = client ? (client.capability === "unsupported" ? "插件版本未审核，已跳过" : "未安装，已跳过") : "客户端已不存在";
    sim.i++; rr(); setTimeout(runTick, 350); return;
  }
  if (item.capability === "manual") {
    item.status = "manual"; item.detail = "App 为手动边界：未写入，已生成指引";
    sim.i++; rr(); setTimeout(runTick, 420); return;
  }
  if (item.external && !item.allowBackupWrite) {
    item.status = "skipped"; item.detail = "检测到外部修改，未覆盖";
    sim.i++; rr(); setTimeout(runTick, 350); return;
  }
  item.status = "writing"; item.detail = item.external && item.allowBackupWrite ? "先备份，再覆盖写入…" : "正在写入…";
  rr();
  setTimeout(() => {
    if (run.status !== "running") return;
    if (run.inject === "fail-cli" && item.clientId === "cli") {
      item.status = "failed"; item.detail = "写入失败：文件被另一进程占用（模拟注入）";
      if (!run.recovery) run.recovery = { txId: run.txId, backups: [], log: `%APPDATA%\\CopilotByokManager\\logs\\${run.txId}.jsonl` };
      run.recovery.backups.push({ client: client.label, path: backupPathFor(client) });
    } else if (run.inject === "interrupt" && sim.i === 1) {
      interruptRun("模拟注入：中途被中断");
      return;
    } else {
      item.status = "applied";
      item.detail = (item.external && item.allowBackupWrite ? "已备份并覆盖 · " : "") + appliedDetail(client);
      client.config = "managed-current";
      if (!run.recovery) run.recovery = { txId: run.txId, backups: [], log: `%APPDATA%\\CopilotByokManager\\logs\\${run.txId}.jsonl` };
      run.recovery.backups.push({ client: client.label, path: backupPathFor(client) });
    }
    sim.i++; rr(); setTimeout(runTick, 400);
  }, 800);
}
function interruptRun(reason) {
  const run = state.run, sim = ui.runSim;
  if (!run) return;
  run.items.forEach((it, idx) => {
    if (idx < sim.i) return;
    if (idx === sim.i && it.status === "writing") { it.status = "interrupted"; it.detail = "写到一半被取消，未生效"; }
    else if (it.status === "queued") { it.status = "not-run"; it.detail = "未执行"; }
  });
  run.status = "interrupted";
  run.interruptReason = reason || "用户取消";
  if (!run.recovery) run.recovery = { txId: run.txId, backups: [], log: `%APPDATA%\\CopilotByokManager\\logs\\${run.txId}.jsonl` };
  state.lastRun = run; state.run = null;
  addAct("recovery", "发布事务中断", "interrupted", `${run.interruptReason}。已完成项可回滚，其余未生效，不会自动重试。`, { label: "恢复选项", page: "home", action: "open-recovery" });
  if (ui.modal && ui.modal.name === "run") renderModal(); else render();
}
function finishRun() {
  const run = state.run;
  if (!run) return;
  const failed = run.items.some(i => i.status === "failed");
  run.status = failed ? "partial" : "done";
  run.items.filter(i => i.status === "applied").forEach(i => {
    const c = state.clients.find(x => x.id === i.clientId);
    if (!c) return;
    if (c.kind === "cli") c.boundConns = [{ connId: run.connId, modelId: run.defModelId || null }];
    else {
      c.boundConns = (c.boundConns || []).filter(b => b.connId !== run.connId);
      c.boundConns.push({ connId: run.connId, modelId: run.defModelId || null });
    }
  });
  state.lastRun = run; state.run = null;
  const applied = run.items.filter(i => i.status === "applied").length;
  addAct("publish", `发布 → ${run.items.length} 个目标`, failed ? "partial" : "success",
    `${run.connName}：${applied} 个已写入${failed ? "，含失败项" : ""}。Key 入系统密钥库，未出现在日志。`, { label: "查看结果", page: "home", action: "open-lastrun" });
  if (ui.modal && ui.modal.name === "run") renderModal(); else render();

function saveConn() {
  const ed = editorConn();
  if (!ed.name.trim()) { toast("名称不能为空", "err"); return; }
  if (!/^https?:\/\/.+/.test(ed.baseUrl.trim())) { toast("接口地址需以 http(s):// 开头", "err"); return; }
  ed.headers = ed.headers.filter(h => h.k.trim());
  if (ed.apiKeyDraft && ed.apiKeyDraft.trim()) ed.apiKeySaved = true;
  delete ed.apiKeyDraft;
  if (ed.models.length && !ed.models.some(m => m.isDefault && m.enabled)) { const f = ed.models.find(m => m.enabled); if (f) f.isDefault = true; }
  ed.updatedAt = Date.now();
  if (ui.connNew) { state.connections.push(ed); addAct("settings", "新建连接「" + ed.name + "」", "info", "已保存（未发布）。", { label: "去总览", page: "home" }); }
  else {
    const i = state.connections.findIndex(c => c.id === ed.id);
    if (i >= 0) state.connections[i] = ed;
    addAct("settings", "编辑连接「" + ed.name + "」", "info", "已保存（未发布）；相关预览已失效。", { label: "去总览", page: "home" });
  }
  ui.connNew = false; ui.connEditId = ed.id; ui.connEditor = null;
  toast("已保存（未发布）", "ok");
  render();
}
function saveModel() {
  const ed = editorConn();
  const em = ui.editingModel;
  const val = id => ($("#" + id) ? $("#" + id).value : "");
  const chk = id => ($("#" + id) ? $("#" + id).checked : false);
  const modelId = val("fm-modelId").trim();
  if (!modelId) { toast("模型 ID 不能为空", "err"); return; }
  const data = { modelId, name: val("fm-name").trim() || modelId, ctx: Number(val("fm-ctx")) || null, maxOut: Number(val("fm-maxout")) || null, enabled: chk("fm-enabled"), isDefault: chk("fm-default"), caps: { tool: chk("fm-tool"), vision: chk("fm-vision"), reason: chk("fm-reason") } };
  if (em.isNew) ed.models.push(mkModel(Object.assign({ id: em.id }, data)));
  else { const m = ed.models.find(x => x.id === em.id); if (m) Object.assign(m, data); }
  if (data.isDefault) ed.models.forEach(m => { if (m.id !== em.id) m.isDefault = false; });
  closeModal(); render(); toast("模型已保存（未发布）", "ok");
}
function deleteConn() {
  const ed = editorConn();
  const mode = ($('input[name="delMode"]:checked') || {}).value || "revoke";
  const managed = state.clients.filter(c => c.installed && (c.config === "managed-current" || c.config === "managed-changed") && c.capability === "auto");
  if (mode === "revoke") managed.forEach(c => {
    c.boundConns = (c.boundConns || []).filter(b => b.connId !== ed.id);
    if (!(c.boundConns || []).length) c.config = "not-configured";
  });
  state.connections = state.connections.filter(c => c.id !== ed.id);
  if (state.draft.connId === ed.id) state.draft = { connId: state.connections[0] ? state.connections[0].id : null, modelIds: [], targetIds: state.draft.targetIds };
  if (state.preview && state.preview.connId === ed.id) state.preview = null;
  addAct("settings", "删除连接「" + ed.name + "」", "info", mode === "revoke" ? `已先撤销 ${managed.length} 个客户端中的受管配置。` : "仅停止管理，客户端配置保留。", null);
  ui.connEditor = null; ui.connNew = false; ui.connEditId = state.connections[0] ? state.connections[0].id : null;

function fetchModels() {

function doRescan() {

function usageImport() {
  const rnd = mulberry32(Date.now() % 2147483647);
  const added = [];
  for (let i = 0; i < 16; i++) {
    const byok = rnd() < 0.7;
    added.push({
      id: uid("u"), ts: Date.now() - Math.floor(rnd() * 20 * 3600e3),
      clientId: ["cli", "vs-stable", "jb-idea"][Math.floor(rnd() * 3)],
      connId: byok ? "conn-galaxy" : null, model: byok ? "claude-sonnet-5" : "gpt-5",
      route: byok ? "byok" : "official", confidence: byok ? "identity" : "explicit",
      requests: 1 + Math.floor(rnd() * 5), sessions: 1, input: Math.floor(3e3 + rnd() * 50e3), output: Math.floor(800 + rnd() * 8e3),
      cacheRead: Math.floor(rnd() * 20e3), cacheWrite: Math.floor(rnd() * 5e3), quality: "complete"
    });
  }
  state.usage.records = added.concat(state.usage.records);
  state.usage.sources.local = { enabled: true, status: "available", count: state.usage.records.length, range: "09-28 ~ 10-11", note: "本地导入 · 仅元数据" };
  addAct("usage", "导入本地用量", "success", "新导入 " + added.length + " 条（模拟，仅元数据）。", null);
  toast("已导入 " + added.length + " 条（模拟）", "ok");
  render();
}
function resPublish() {
  const tab = ui.resTab;
  const list = (state.resources[tab] || []).filter(r => r.enabled);
  const results = [];
  resTargets(tab).forEach(t => {
    const c = state.clients.find(x => x.id === t.clientId);
    const writable = list.filter(r => !(tab === "mcp" && r.type === "command"));
    if (t.support === "auto" && writable.length && c && c.installed) results.push({ target: t.label, status: "success", detail: `合并写入 ${writable.length} 项，保留原有内容` });
    else if (t.support === "manual") results.push({ target: t.label, status: "manual", detail: "需在客户端里手动配置" });
    else if (t.support === "unsupported") results.push({ target: t.label, status: "skipped", detail: "不支持该资源类型" });
    else results.push({ target: t.label, status: "skipped", detail: "无可发布内容" });
  });
  state.resPublish = { at: Date.now(), tab, results };
  addAct("resource", "发布资源 · " + RES_TABS[tab], results.some(r => r.status !== "success") ? "partial" : "success",
    results.map(r => `${r.target}：${r.detail}`).join("；") + "。", { label: "查看资源", page: "more", tab: "resources" });
  closeModal(); toast("发布完成（部分目标需手动）", "ok");

}

document.addEventListener("change", e => {
  const el = e.target;

  if (state.recovery.active && !el.closest(".demo-strip")) { toast("只读恢复模式：修改未生效", "err"); render(); return; }

  if (ca === "draft-target") { const arr = state.draft.targetIds, i = arr.indexOf(el.dataset.id); if (el.checked && i < 0) arr.push(el.dataset.id); if (!el.checked && i >= 0) arr.splice(i, 1); render(); return; }
  if (ca === "pv-backup-write" && state.preview) { const it = state.preview.items.find(x => x.clientId === el.dataset.id); if (it) it.allowBackupWrite = el.checked; renderModal(); return; }
  if (ca === "model-enable") { const m = editorConn().models.find(x => x.id === el.dataset.id); if (m) { m.enabled = el.checked; if (!m.enabled && m.isDefault) m.isDefault = false; } render(); return; }
  if (ca === "model-default") { editorConn().models.forEach(m => m.isDefault = m.id === el.dataset.id); render(); return; }
  if (ca === "inst-toggle") { ui.installing.items[Number(el.dataset.idx)].selected = el.checked; return; }
  if (ca === "conn-toggle") { const c = state.connections.find(x => x.id === el.dataset.id); if (c) { c.disabled = !el.checked; if (c.disabled && state.draft.connId === c.id) { state.draft.connId = null; state.draft.modelIds = []; } toast(el.checked ? "连接已启用" : "连接已停用：不再出现在首页切换区", "info"); } render(); return; }
  if (ca === "fetch-pick") { const p = (ui.fetchCandidates || [])[Number(el.dataset.idx)]; if (p) p.selected = el.checked; return; }
  if (ca === "res-enable") { const r = state.resources[el.dataset.tab].find(x => x.id === el.dataset.id); if (r) r.enabled = el.checked; return; }
  if (ca === "src-toggle") { const s = state.usage.sources[el.dataset.src]; s.enabled = el.checked; toast(el.checked ? "数据源已启用" : "已停用（数据保留，不参与统计）", "info"); render(); return; }
  if (ca === "consent-toggle") { state.usage.consent = el.checked; addAct("settings", el.checked ? "开启本地采集" : "关闭本地采集", "info", el.checked ? "仅元数据。" : "已导入数据保留，可在用量页清除。", null); render(); return; }
  if (el.dataset.filter) { ui.usageFilters[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.field !== undefined && editorConn()) { const ed = editorConn(); if (el.dataset.field === "apiKeyDraft") ed.apiKeyDraft = el.value; else ed[el.dataset.field] = el.value; return; }
  if (el.dataset.hdrK !== undefined) { editorConn().headers[Number(el.dataset.hdrK)].k = el.value; return; }
  if (el.dataset.hdrV !== undefined) { editorConn().headers[Number(el.dataset.hdrV)].v = el.value; return; }
});
